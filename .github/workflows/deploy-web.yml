# Веб-версия игры на GitHub Pages: https://rayforst.github.io/games/
# Деплой идёт при пуше в main или в рабочую ветку, а также вручную (workflow_dispatch).
# Один раз вручную: Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Без этого шаг configure-pages падает с «Resource not accessible by integration».
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, claude/fervent-franklin-ikmakg]
    paths: ['combat/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: combat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: combat/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Export web bundle
        run: npx expo export --platform web
        env:
          EXPO_NO_TELEMETRY: '1'
      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: combat/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
